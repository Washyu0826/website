name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Screenshot baselines are per platform, so the Linux set can only be produced on a Linux runner.
  # Run this workflow by hand with `update_snapshots` on, then download the visual-snapshots
  # artifact and commit it. Playwright only writes a baseline that is missing; one that merely
  # differs is reported as a failure and left alone, which is why a manual switch is needed at all.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the Linux screenshot baselines instead of comparing against them
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: 'true'
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Everything that needs neither a production build nor a browser. Fails fast and in parallel
  # with the browser job below.
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is written by npm 10 (what Node 22 and Vercel ship). Installing it with a
      # different major drops transitive entries and `npm ci` then refuses the tree, so pin it.
      - name: Pin npm to the lockfile's major
        run: npm i -g npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Pure logic, node:test, no jsdom. This is the fast path and stays that way.
      - name: Unit tests
        run: npm test

      # Component behaviour, Vitest + Testing Library + jsdom.
      - name: Component tests
        run: npm run test:components

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Build, end-to-end, visual and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is written by npm 10 (what Node 22 and Vercel ship). Installing it with a
      # different major drops transitive entries and `npm ci` then refuses the tree, so pin it.
      - name: Pin npm to the lockfile's major
        run: npm i -g npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Build (demo content)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Screenshot comparison against the committed Linux baselines.
      - name: Visual regression
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:visual

      # The manual path: rewrite the baselines rather than compare against them. It is expected to
      # end green with the new images in the artifact below; the review happens on the pull request
      # that commits them, where every changed pixel is visible in the diff.
      - name: Rewrite visual baselines
        if: ${{ inputs.update_snapshots }}
        run: npm run test:visual:update

      - name: Upload visual snapshots
        if: failure() || inputs.update_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/browser/visual.spec.ts-snapshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Lighthouse needs a server it can keep hitting, so this one is started by hand rather than
      # through Playwright's webServer.
      - name: Start the production server
        run: |
          npm run start -- -p 3000 &
          for _ in $(seq 1 60); do
            curl -sSf http://127.0.0.1:3000/zh > /dev/null && exit 0
            sleep 2
          done
          echo "The production server never came up." && exit 1

      # Fails under 90 on performance, accessibility, best practices and SEO. The demo build marks
      # every page noindex on purpose, so the script drops `is-crawlable` from the SEO category in
      # demo mode and says so in its output; a real-content run scores it normally.
      - name: Lighthouse
        run: npm run audit:lighthouse
        env:
          SITE_URL: http://127.0.0.1:3000
          LIGHTHOUSE_MIN_SCORE: '90'

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse/
          retention-days: 7
          if-no-files-found: ignore
